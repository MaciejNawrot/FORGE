name: Setup workspace
description: Install pnpm and Node, restore caches, and install dependencies.

inputs:
  turbo-cache:
    description: Whether to restore/save the Turborepo cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v5
      with:
        node-version-file: ".node-version"
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Keyed on the run id so every run writes a fresh entry, with restore-keys
    # falling back to the most recent cache for the same lockfile — that is
    # what lets turbo replay unchanged tasks.
    - name: Turbo cache
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-
