name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Lint
        run: pnpm lint

      - name: Boundaries
        run: pnpm boundaries

      # Depends on ^build, so both apps are checked against freshly compiled
      # contract types rather than a stale dist. See ADR 0005.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm --filter @acme/ui build-storybook

  e2e:
    name: API e2e (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d acme_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/acme_test
      BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long-xx
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Run e2e
        run: pnpm --filter @acme/api test:e2e

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Building both on every PR is what stops the Dockerfiles from silently
      # rotting as the workspace graph changes.
      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t gym0-api:ci .

      - name: Build web image
        run: docker build -f infra/docker/Dockerfile.web -t gym0-web:ci .

  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - run: pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  deploy-api:
    name: Deploy API to Fly
    needs: [ci, e2e, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # One deploy at a time; a second push landing mid-rollout waits instead
    # of racing the first (no queue drop, unlike ci's cancel-in-progress).
    concurrency:
      group: deploy-api-production
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Runs from the full monorepo checkout (not the prod image, which has
      # no devDependencies) against the real prod database, before the new
      # image is live. See infra/fly/README.md for the required secret.
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --config infra/fly/api.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
